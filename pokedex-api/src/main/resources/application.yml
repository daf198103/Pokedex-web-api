spring:
  application:
    name: pokedex-api
  datasource:
    url: jdbc:h2:mem:pokedex;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=2000,expireAfterWrite=1h

app:
  pokeapi:
    base-url: https://pokeapi.co/api/v2
    connect-timeout-ms: 3000
    read-timeout-ms: 8000
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdef}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
